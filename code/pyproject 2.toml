[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tfm-code"
version = "0.1.0"
dependencies = ["glmhmmt"]

[tool.uv.workspace]
members = ["glmhmmt"]

[tool.uv.sources]
glmhmmt = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["scripts", "tasks"]

[tool.hatch.build.targets.wheel.force-include]
"paths.py" = "paths.py"
